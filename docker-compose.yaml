services:
  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DEFAULT_BUCKETS: default
    volumes:
      - minio_data:/data
    command: ['server', '--console-address', ':9001', '/data']
    ports:
      - 9000:9000
      - 9001:9001
    depends_on:
      - redis

volumes:
  redis_data:
  minio_data:
