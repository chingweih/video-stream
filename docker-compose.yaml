services:
  redis:
    network_mode: 'host'
    image: redis:8.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    network_mode: 'host'
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DEFAULT_BUCKETS: default
    volumes:
      - minio_data:/data
    command: ['server', '--console-address', ':9001', '/data']
    ports:
      - 9000:9000
      - 9001:9001
    depends_on:
      - redis

  worker:
    network_mode: 'host'
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    depends_on:
      - redis
      - minio
    environment:
      - REDIS_URL=redis://localhost:6379/0
      - S3_ACCESS_KEY_ID=admin
      - S3_SECRET_ACCESS_KEY=password
      - S3_ENDPOINT=http://localhost:9000
      - S3_BUCKET=video-storage

  api_migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.migration
    volumes:
      - api_data:/app/packages/api/data

  api:
    network_mode: 'host'
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    volumes:
      - api_data:/app/data
    depends_on:
      api_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
      worker:
        condition: service_started
    ports:
      - 3000:3000
    environment:
      REDIS_URL: redis://localhost:6379/0
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: video-storage

volumes:
  redis_data:
  minio_data:
  api_data:
